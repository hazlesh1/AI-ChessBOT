<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAHHHHHHHHH THIS TOOK ME 2 HOURS TO JS FRICKING DEBUG THE PAGEEEE ElO of 1000 cuz laptop gonna burn if more</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; text-align: center; padding-top: 50px; }
        #myBoard { width: 400px; margin: auto; border: 5px solid #34495e; border-radius: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .controls { margin-top: 20px; }
        button { background: #e67e22; border: none; color: white; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 5px; transition: background 0.3s; }
        button:hover { background: #d35400; }
        #status { font-weight: bold; color: #f1c40f; }
        .info { margin-top: 10px; font-size: 14px; color: #bdc3c7; }
    </style>
</head>
<body>

    <h2>Leo's Chess Engine v1.0</h2>
    
    <div id="myBoard"></div>
    
    <div class="controls">
        <p>Status: <span id="status">Waiting to Start...</span></p>
        <button onclick="resetGame('white')">Play as White</button>
        <button onclick="resetGame('black')">Play as Black</button>
    </div>

    <div class="info">
        * Drag pieces to move. Castling supported if rules are met.
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // Logic to request a move from the Python server
        function makeEngineMove() {
            var fen = game.fen();
            $status.text("Engine thinking...");

            $.post("/move", { fen: fen }, function(data) {
                console.log("Engine Output:", data.move);
                
                if (data.move && data.move !== "none" && data.move !== "") {
                    // Extract source and target (e.g., "e2e4" -> "e2", "e4")
                    var from = data.move.substring(0, 2);
                    var to = data.move.substring(2, 4);
                    
                    var move = game.move({
                        from: from,
                        to: to,
                        promotion: 'q' // Always promote to queen for simplicity
                    });

                    if (move === null) {
                        $status.text("Error: Engine tried illegal move " + data.move);
                    } else {
                        board.position(game.fen());
                        $status.text("Your Turn");
                    }
                } else {
                    $status.text("Game Over / No Moves");
                }
            }).fail(function() {
                $status.text("Server Error! Is your Python running?");
            });
        }

        // Logic when you drop a piece
        function onDrop(source, target) {
            // Check if it's the player's turn based on board orientation
            var turn = game.turn(); // 'w' or 'b'
            var playerColor = board.orientation().charAt(0); // 'w' or 'b'

            if (turn !== playerColor) {
                return 'snapback';
            }

            // Try the move
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            // Illegal move
            if (move === null) return 'snapback';

            // Update board for castling/en passant visuals
            board.position(game.fen());

            // Trigger engine response after a short delay
            window.setTimeout(makeEngineMove, 500);
        }

        // Reset and Start Game
        function resetGame(color) {
            game.reset();
            board.orientation(color);
            board.start();
            
            if (color === 'black') {
                $status.text("Engine is moving first...");
                // Since White moves first and user is Black, Engine moves now
                makeEngineMove();
            } else {
                $status.text("Your Turn (White)");
            }
        }

        // Configuration
        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            // Use CDN images to avoid 404 errors
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('myBoard', config);
        $status.text("Select a side to start!");

    </script>
</body>
</html>
